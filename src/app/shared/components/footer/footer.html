<footer class="mt-auto border-t border-s-accent bg-base-100 px-6 pt-8 pb-8">
  <div class="mx-auto flex max-w-300 flex-col items-center gap-10">
  
    <!-- LOGO -->
    <app-logo [size]="50" alt="Shelfspot's logo" />   

    <div class="flex flex-wrap justify-center gap-8 md:gap-12">
      <a href="#" target="_blank" 
         class="group flex items-center gap-3 text-sm md:text-lg font-medium text-secondary-brown transition-all duration-200 hover:-translate-y-1 hover:text-accent">
        <app-icon name="googlemaps.svg" [size]="40" />
        <span class="border-b border-transparent group-hover:border-accent">Map</span>
      </a>
      
      <a href="#" target="_blank" 
         class="group flex items-center gap-3 text-sm md:text-lg font-medium text-secondary-brown transition-all duration-200 hover:-translate-y-1 hover:text-accent">
        <app-icon name="linkedin.svg" [size]="40" />
        <span class="border-b border-transparent group-hover:border-accent">LinkedIn</span>
      </a>

      <a href="mailto:eliagiolli22@gmail.com" 
         class="group flex items-center gap-3 text-sm md:text-lg font-medium text-secondary-brown transition-all duration-200 hover:-translate-y-1 hover:text-accent">
        <app-icon name="mail.svg" [size]="40" />
        <span class="border-b border-transparent group-hover:border-accent">Email</span>
      </a>
    </div>

    <div class="mt-4 text-xs text-primary border-t border-s-accent-soft pt-8 w-full text-center">
      &copy; {{ currentYear }} ShelfSpot. Built with Angular & OpenLibrary API.
    </div>
  </div>
</footer>
