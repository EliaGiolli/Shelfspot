
<header class="sticky top-0 z-1000 w-full border-b border-accent/20 bg-surface-elevated px-4 backdrop-blur-md sm:px-6 md:bg-base-100">
  <div class="relative mx-auto flex min-h-20 max-w-300 items-center justify-between gap-6">
    <!-- Brand -->
    <app-logo 
      [size]="40"
    />

    <!-- Mobile menu button -->
    <button
      #menuButton
      type="button"
      (click)="toggleMenu()"
      class="inline-flex cursor-pointer items-center justify-center rounded-lg p-2 text-secondary-brown transition-colors hover:text-accent focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-accent md:hidden"
      [attr.aria-expanded]="isMenuOpen()"
      aria-controls="main-navigation"
      [attr.aria-label]="isMenuOpen() ? 'Close navigation menu' : 'Open navigation menu'"
    >
      <app-icon
        [name]="isMenuOpen() ? CLOSE_ICON : MENU_ICON"
        [size]="36"
        aria-hidden="true"
      />
    </button>

    <!-- Navigation -->
    <nav
      id="main-navigation"
      [class.max-h-0]="!isMenuOpen()"
      [class.max-h-[calc(100dvh-5rem)]]="isMenuOpen()"
      [class.invisible]="!isMenuOpen()"
      [class.visible]="isMenuOpen()"
      [class.opacity-0]="!isMenuOpen()"
      [class.opacity-100]="isMenuOpen()"
      [class.overflow-y-auto]="isMenuOpen()"
      class="absolute left-0 top-full z-50 flex w-full flex-col items-center overflow-hidden bg-surface-elevated border-b border-accent/20 shadow-lg transition-[max-height,opacity,visibility] duration-300 ease-in-out md:visible md:static md:max-h-none md:w-auto md:flex-row md:gap-6 md:overflow-visible md:bg-transparent md:opacity-100 md:shadow-none"
    >
      @for (item of navItems; track item.path) {
        <app-button-link
          [routerLink]="item.path"
          routerLinkActive="!text-accent"
          [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
          (click)="closeMenu()"
          variant="outline"
        >
          {{ item.label }}
        </app-button-link>
      }
    </nav>

  </div>
</header>
