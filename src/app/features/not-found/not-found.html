<main
  class="flex min-h-[calc(100dvh-80px)] items-center justify-center px-4 py-16 bg-base-200"
  role="main"
>
  <section
    class="relative flex w-full max-w-lg flex-col items-center gap-8 rounded-box bg-base-100 px-10 py-14 text-center shadow-lg border border-base-300"
    aria-labelledby="not-found-title"
  >

    <!-- Decorative top divider -->
    <div class="absolute -top-px left-10 right-10 h-1 rounded-full bg-gradient-to-r from-transparent via-secondary to-transparent opacity-60" aria-hidden="true"></div>

    <!-- Icon + error code -->
    <div class="flex flex-col items-center gap-3" aria-hidden="true">
      <app-icon name="monitor.svg" [size]="80" class="ghost-icon opacity-50" />
      <span class="bg-gradient-to-br from-primary to-secondary bg-clip-text text-transparent text-8xl font-extrabold tracking-tighter leading-none">
        404
      </span>
    </div>

    <!-- Message -->
    <div class="flex flex-col gap-2">
      <h1 id="not-found-title" class="text-2xl font-bold text-primary md:text-3xl">
        Oops! Page not found
      </h1>
      <p class="text-base-content/70 text-sm leading-relaxed">
        It seems that the link is broken or that the requested page was moved away.<br />
        Don't worry, you can navigate back below:
      </p>
    </div>

    <!-- Actions -->
    <div class="flex flex-wrap items-center justify-center gap-3 w-full">
      <app-button-link
        variant="primary"
        routerLink="/"
        ariaLabel="Back to Homepage"
      >
        <app-icon name="arrow-left" [size]="18" />
        <span>Back to the Homepage</span>
      </app-button-link>

      <app-button-link
        variant="outline"
        routerLink="/projects"
        ariaLabel="Go to the projects"
      >
        <span>Explore my projects</span>
        <app-icon name="database" [size]="18" />
      </app-button-link>
    </div>

  </section>
</main>
