@let state = apiState();

<section
  class="flex flex-col items-center w-full max-w-7xl mx-auto p-8"
  aria-labelledby="main-title"
>
  <header class="flex flex-col items-center text-center gap-4 mb-10">
    <div class="flex items-center gap-4">
      <app-icon
        name="book-open.svg"
        [size]="48"
        class="text-accent"
        aria-hidden="true"
      />

      <h1
        class="text-primary text-4xl font-serif font-bold italic tracking-tight"
        id="main-title"
      >
        Discovery <span class="text-accent">Hub</span>
      </h1>
    </div>

    <p class="text-primary/70 max-w-2xl leading-relaxed">
      Welcome to the ShelfSpot archives. Search millions of titles and find your next favorite read.
    </p>
  </header>

  <div class="w-full max-w-4xl flex flex-col gap-4">
    <app-search-book-input
      [initialQuery]="initialQuery()"
      (search)="search.emit($event)"
    />

    @if (state.status === 'loading') {
      <div
        class="flex items-center justify-center gap-3"
        role="status"
        aria-live="polite"
      >
        <div
          class="animate-spin rounded-full h-5 w-5 border-b-2 border-accent"
        ></div>
        <span class="text-primary/60">Searching...</span>
      </div>
    }

    @if (books().length > 0) {
      <div class="flex justify-end">
        <button
          type="button"
          (click)="clearSearch.emit()"
          class="text-xs font-bold uppercase tracking-widest text-primary/40 hover:text-accent transition-colors flex items-center gap-2"
          aria-label="Clear all search results"
        >
          <app-icon
            name="trash.svg"
            [size]="40"
            aria-hidden="true"
          />
          Clear Results
        </button>
      </div>
    }
  </div>

  <div class="w-full mt-8">
    <app-search-results
      [apiState]="apiState()"
      [books]="books()"
      [currentPage]="currentPage()"
      [hasNextPage]="hasNextPage()"
      (retry)="retry.emit()"
      (nextPage)="nextPage.emit()"
      (previousPage)="previousPage.emit()"
      (viewDetails)="viewDetails.emit($event)"
    />
  </div>
</section>
