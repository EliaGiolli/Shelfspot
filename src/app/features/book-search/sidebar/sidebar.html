<aside 
    [class.w-64]="!isCollapsed()" 
    [class.w-20]="isCollapsed()"
    [class.justify-center]="isCollapsed()"
    [class.items-center]="isCollapsed()"
    class="flex flex-col h-full bg-surface-elevated text-text-main transition-all duration-300 border-r border-primary/10 shadow-xl"
  >
    <div class="p-6 flex items-center justify-between">
        @if (!isCollapsed()) {
            <span class="font-serif font-bold text-xl md:text-2xl text-accent italic">ShelfSpot</span>
        }
            <app-button
                variant="outline"
                [ariaLabel]="isCollapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
                [attr.aria-expanded]="!isCollapsed()"
                (click)="toggleSidebar()"
            >
                <app-icon
                    [name]="isCollapsed() ? 'menu.svg' : 'arrow-left.svg'"
                    [size]="45"
                />
            </app-button>
        </div>

        <nav class="flex-1 mt-4 px-3 space-y-2">
            @for (item of menuItems; track item.path) {
                <app-button-link
                    [routerLink]="item.path"
                    [activeClasses]="'bg-accent text-white'"
                    variant="outline"
                    [appTooltip]="item.label"
                    [appTooltipEnabled]="isCollapsed()"
                >
                    <app-icon [name]="item.icon" [size]="40" class="min-w-6" />
                    
                    <span 
                        class="ml-4 font-medium transition-opacity duration-200"
                        [class.opacity-0]="isCollapsed()"
                        [class.hidden]="isCollapsed()"
                    >
                        {{ item.label }}
                    </span>
                </app-button-link>
            }
        </nav>
</aside>
