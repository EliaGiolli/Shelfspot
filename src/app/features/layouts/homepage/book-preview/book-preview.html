<section
  class="my-20 mx-auto max-w-7xl px-4"
  aria-labelledby="book-preview-title"
>
  <header class="mb-10 text-center">
    <h2
      id="book-preview-title"
      class="mb-4 font-serif text-3xl font-bold text-primary md:text-4xl"
    >
      Discover Your Next Read
    </h2>

    <p class="mx-auto max-w-2xl text-base-content/70">
      Explore our handpicked selection of fiction, science and timeless classics.
    </p>
  </header>

  <!-- Category filters -->
  <nav
    class="mb-8 flex flex-wrap justify-center gap-3"
    aria-label="Filter books by category"
  >
    <button class="btn btn-primary rounded-full">All</button>
    <button class="btn btn-outline rounded-full">Narrativa</button>
    <button class="btn btn-outline rounded-full">Scienza</button>
    <button class="btn btn-outline rounded-full">Classici</button>
  </nav>

  <!-- Books carousel -->
  <article class="carousel-item w-56">
    <app-card
        [titleId]="'preview-book-title'"
        variant="compact"
        class="w-full"
    >
        <div card-header>
        <h3
            id="preview-book-title"
            class="line-clamp-2 font-serif text-lg font-bold text-primary"
        >
            Book title
        </h3>
        </div>

        <div card-body>
        <div class="flex h-64 items-center justify-center overflow-hidden rounded-xl bg-base-200">
            <!-- Book cover -->
            <img
            src="assets/images/book-placeholder.png"
            alt="Book cover"
            class="h-full w-full object-contain"
            />
        </div>

        <p class="mt-3 text-sm text-base-content/70">
            Author name
        </p>

        <p class="text-xs text-base-content/50">
            First published: 2020
        </p>
        </div>

        <div card-footer>
        <a
            href="#"
            class="btn btn-outline btn-primary btn-sm w-full rounded-full"
        >
            View details
        </a>
        </div>
    </app-card>
    </article>

    <!-- Pagination -->
    <div class="join mt-8 flex justify-center">
    <!-- Pagination controls will be rendered here -->
    </div>

</section>
