<section 
  class="hero min-h-[85vh] bg-base-100 px-6 md:px-16 py-16" 
  aria-label="Hero section"
>
  <div class="hero-content flex-col lg:flex-row gap-12 lg:gap-20 max-w-7xl w-full items-center">

    <!-- Left: Text content -->
    <div class="lg:flex-1 max-w-xl">
      <p class="text-xs font-bold uppercase tracking-[0.25em] text-secondary mb-6">
        Your Personal Library · Est. 2024
      </p>

      <h1 class="font-serif text-primary leading-[1.05] mb-8">
        Stories worth<br>keeping close.
      </h1>

      <p class="text-base-content/70 text-base leading-relaxed mb-10 max-w-sm">
        A considered collection of fiction, essays, poetry, and field notes
        for readers who still believe a book can alter the weather of a room.
      </p>

      <div class="flex flex-wrap gap-4">
        <app-button-link
          variant="primary"
          routerLink="/books/search"
          ariaLabel="Browse the book collection"
          class="w-fit"
        >
          Browse collection
        </app-button-link>

        <app-button-link
          variant="outline"
          routerLink="/contacts"
          ariaLabel="Contact us"
          class="w-fit"
        >
          Contact us
        </app-button-link>
      </div>
    </div>

    <!-- Right: Image -->
    <div class="lg:flex-1 w-full">
      <img
        src="assets/library-hero-section.jpg"
        alt="Stacks of books arranged on a warm wooden shelf in a sunlit library"
        class="w-full h-[420px] lg:h-[560px] object-cover rounded-3xl shadow-2xl"
      />
    </div>

  </div>
</section>
