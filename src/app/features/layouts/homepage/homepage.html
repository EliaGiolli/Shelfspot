<section class="bg-base-200 grow container mx-auto px-4 py-8">
  <app-herosection />

  <app-bento-grid />
  
  <app-book-preview />
  
  <app-benefits />
  <section class="my-20 p-6 max-w-3xl mx-auto" aria-labelledby="faq-title">
    <h2 id="faq-title" class="text-primary text-3xl font-serif font-bold mb-10 text-center">Frequently Asked Questions</h2>
    
    <div class="space-y-4">
      @for (faq of faqs; track faq.question; let i = $index) {
        <div class="bg-light rounded-md border-l-4 border-danger px-2">
          <button 
            (click)="toggleFaq(i)"
            [attr.aria-expanded]="expandedIndex() === i"
            class="w-full py-6 flex justify-between items-center text-left font-bold text-primary hover:text-danger transition-colors focus:outline-none"
          >
            <span class="text-lg font-serif">{{ faq.question }}</span>
            <span class="transform transition-transform duration-300" [class.rotate-180]="expandedIndex() === i">
              <app-icon name="chevron-down.svg" [size]="40" />
            </span>
          </button>
          
          <div 
            class="overflow-hidden transition-all duration-300"
            [style.max-height]="expandedIndex() === i ? '200px' : '0px'"
          >
            <p class="p-3 text-primary/70 leading-relaxed bg-accent/30">
              {{ faq.answer }}
            </p>
          </div>
        </div>
      }
    </div>
  </section>
  <section class="bg-light py-16 px-6 max-w-6xl mx-auto text-center rounded-md shadow-lg">
      <h2 class="text-accent text-4xl font-extrabold mb-6">Ready to Dive In?</h2>
      <p class="max-w-xl mx-auto mb-10 text-lg">Contact us today to borrow your favorite books and start your adventure!</p>
      <a href="/books/loans" aria-label="Contact us to borrow books" class="inline-block font-semibold rounded-lg px-10 py-4 shadow-lg transition bg-danger text-light hover:bg-danger/80">Borrow a Book Now!</a>
  </section>
</section>
