<div class="drawer lg:drawer-open h-screen overflow-hidden bg-main m-0">
  <input
    id="book-layout-drawer"
    type="checkbox"
    class="drawer-toggle"
    [checked]="isDrawerOpen()"
    (change)="onDrawerToggle($event)"
  />

  <main class="drawer-content flex flex-col min-w-0 h-screen overflow-hidden">
    <header class="h-16 border-b border-accent-soft bg-surface-elevated flex items-center gap-4 px-4 sm:px-8">
      <label
        for="book-layout-drawer"
        aria-label="Open navigation sidebar"
        class="btn btn-ghost btn-square drawer-button lg:hidden"
      >
        <app-icon name="menu.svg" [size]="28" aria-hidden="true" />
      </label>

      <h2 class="text-secondary-brown font-medium uppercase text-xs tracking-widest">
        Dashboard / Books
      </h2>
    </header>

    <section class="grow overflow-y-auto custom-scrollbar">
      <router-outlet />
    </section>
  </main>

  <div class="drawer-side z-40">
    <label
      for="book-layout-drawer"
      aria-label="close sidebar"
      class="drawer-overlay"
    ></label>

    <aside
      [class.lg:w-64]="!isCollapsed()"
      [class.lg:w-20]="isCollapsed()"
      [class.lg:items-center]="isCollapsed()"
      class="flex flex-col min-h-full w-64 bg-surface-elevated text-text-main transition-all duration-300 border-r border-primary/10 shadow-xl"
    >
      <div
        class="p-6 flex items-center justify-between w-full"
        [class.lg:justify-center]="isCollapsed()"
      >
        @if (!isCollapsed()) {
          <span class="font-serif font-bold text-xl md:text-2xl text-accent italic">
            ShelfSpot
          </span>
        } @else {
          <span class="font-serif font-bold text-xl md:text-2xl text-accent italic lg:hidden">
            ShelfSpot
          </span>
        }

        <app-button
          class="hidden lg:inline-flex"
          variant="outline"
          [ariaLabel]="isCollapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
          [ariaExpanded]="!isCollapsed()"
          (click)="toggleSidebar()"
        >
          <app-icon
            [name]="isCollapsed() ? 'menu.svg' : 'arrow-left.svg'"
            [size]="45"
          />
        </app-button>

        <label
          for="book-layout-drawer"
          aria-label="Close navigation sidebar"
          class="btn btn-ghost btn-square lg:hidden"
        >
          <app-icon name="x.svg" [size]="28" aria-hidden="true" />
        </label>
      </div>

      <nav aria-label="Book navigation" class="flex-1 mt-4 px-3 space-y-2 w-full">
        @for (item of menuItems; track item.path) {
          <app-button-link
            [routerLink]="item.path"
            [activeClasses]="'bg-accent text-white'"
            variant="outline"
            [appTooltip]="item.label"
            [appTooltipEnabled]="isCollapsed()"
            (click)="closeDrawer()"
          >
            @if (item.icon) {
              <app-icon [name]="item.icon" [size]="40" class="min-w-6" />
            }

            <span
              class="ml-4 font-medium transition-opacity duration-200"
              [class.lg:opacity-0]="isCollapsed()"
              [class.lg:hidden]="isCollapsed()"
            >
              {{ item.label }}
            </span>
          </app-button-link>
        }
      </nav>
    </aside>
  </div>
</div>
